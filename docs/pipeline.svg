<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <style>
    .box   { rx:10; stroke-width:1.5 }
    .t     { font-size:15px; font-weight:600; fill:#1a1a1a }
    .s     { font-size:11.5px; fill:#555 }
    .edge  { stroke:#8a8a8a; stroke-width:1.6; fill:none; marker-end:url(#a) }
    .edge2 { stroke:#c0392b; stroke-width:1.6; fill:none; stroke-dasharray:5 3; marker-end:url(#ar) }
    .lbl   { font-size:11px; fill:#666 }
    .lblr  { font-size:11px; fill:#c0392b }
    .cap   { font-size:12px; fill:#444 }
    @media (prefers-color-scheme: dark) {
      .t { fill:#f0f0f0 } .s { fill:#b8b8b8 } .lbl { fill:#aaa } .cap { fill:#ccc }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="30" y="34" class="t" font-size="18">기념품 반입 상담 — 라우팅 파이프라인</text>
  <text x="30" y="55" class="cap">LangGraph 8노드 · 나가는 길이 셋이다 — 답변 · 되묻기 · 넘김</text>

  <!-- 문의 -->
  <rect x="30" y="100" width="120" height="48" class="box" fill="#eceff1" stroke="#90a4ae"/>
  <text x="90" y="122" class="t" text-anchor="middle" font-size="14">문의</text>
  <text x="90" y="139" class="s" text-anchor="middle">"소시지 사왔는데…"</text>

  <!-- ① classify -->
  <rect x="200" y="94" width="170" height="60" class="box" fill="#e3f0fd" stroke="#4a90d9"/>
  <text x="285" y="115" class="t" text-anchor="middle">① classify</text>
  <text x="285" y="132" class="s" text-anchor="middle">카테고리만 고른다</text>
  <text x="285" y="147" class="s" text-anchor="middle">넘길지는 정하지 않는다</text>

  <!-- ①-b gate -->
  <rect x="200" y="196" width="170" height="66" class="box" fill="#e8eaf6" stroke="#6b73c1"/>
  <text x="285" y="217" class="t" text-anchor="middle">①-b gate</text>
  <text x="285" y="234" class="s" text-anchor="middle">규정을 고를 수 있는가</text>
  <text x="285" y="249" class="s" text-anchor="middle">gpt-4.1 (mini 는 넓게 잡는다)</text>

  <!-- ② assemble -->
  <rect x="200" y="304" width="170" height="82" class="box" fill="#e4f3e8" stroke="#4caf7d"/>
  <text x="285" y="325" class="t" text-anchor="middle">② assemble</text>
  <text x="285" y="342" class="s" text-anchor="middle">도구 호출 · 절 검색 상위 3</text>
  <text x="285" y="357" class="s" text-anchor="middle">IDF · 규정 문서 우선</text>
  <text x="285" y="372" class="s" text-anchor="middle">품목이 걸치면 도구 2개</text>

  <!-- ③ answer -->
  <rect x="480" y="304" width="175" height="82" class="box" fill="#fdf3dc" stroke="#d9a441"/>
  <text x="567" y="325" class="t" text-anchor="middle">③ answer</text>
  <text x="567" y="342" class="s" text-anchor="middle">근거에 있는 말로만</text>
  <text x="567" y="357" class="s" text-anchor="middle">과거 기준은 말하지 않는다</text>
  <text x="567" y="372" class="s" text-anchor="middle">용어 연결 · 기준일 부착</text>

  <!-- ④ verify -->
  <rect x="480" y="432" width="175" height="62" class="box" fill="#fce8e6" stroke="#d9534f"/>
  <text x="567" y="454" class="t" text-anchor="middle">④ verify</text>
  <text x="567" y="471" class="s" text-anchor="middle">답변의 숫자를</text>
  <text x="567" y="486" class="s" text-anchor="middle">근거에서 역추적</text>

  <!-- ask -->
  <rect x="480" y="196" width="175" height="66" class="box" fill="#f3e8fd" stroke="#9b6bc1"/>
  <text x="567" y="217" class="t" text-anchor="middle">되묻기 ask</text>
  <text x="567" y="234" class="s" text-anchor="middle">빠진 정보만 묻는다</text>
  <text x="567" y="249" class="s" text-anchor="middle">도구 호출 0개</text>

  <!-- handoff -->
  <rect x="480" y="100" width="175" height="62" class="box" fill="#f1f3f4" stroke="#9e9e9e"/>
  <text x="567" y="122" class="t" text-anchor="middle">넘김 handoff</text>
  <text x="567" y="139" class="s" text-anchor="middle">지어내지 않는다</text>
  <text x="567" y="154" class="s" text-anchor="middle">관세청 125 · 도구 0개</text>

  <!-- 결과 -->
  <rect x="770" y="196" width="180" height="300" class="box" fill="#eceff1" stroke="#90a4ae"/>
  <text x="860" y="228" class="t" text-anchor="middle" font-size="15">사용자에게</text>
  <text x="790" y="258" class="s">답변 + 분류 + 호출한 도구</text>
  <text x="790" y="277" class="s">+ 용어 연결 + 근거 절 원문</text>
  <text x="790" y="296" class="s">+ 검증 결과</text>
  <text x="790" y="330" class="s" font-weight="600">나가는 길이 셋이다</text>
  <text x="790" y="354" class="s">답변 — 근거로 답할 수 있다</text>
  <text x="790" y="373" class="s">되묻기 — 규정을 고를 수 없다</text>
  <text x="790" y="392" class="s">넘김 — 근거가 없다</text>
  <text x="790" y="424" class="s">셋을 가르는 판단을</text>
  <text x="790" y="443" class="s" font-weight="600">서로 다른 곳에서 한다.</text>
  <text x="790" y="462" class="s">모델의 확신이 기준인 곳은</text>
  <text x="790" y="481" class="s">한 곳도 없다.</text>

  <!-- 도구 -->
  <rect x="30" y="304" width="150" height="82" class="box" fill="#f7f7f7" stroke="#bdbdbd" stroke-dasharray="4 3"/>
  <text x="105" y="325" class="s" text-anchor="middle" font-weight="600">도구 4개</text>
  <text x="105" y="343" class="s" text-anchor="middle">lookup_duty</text>
  <text x="105" y="358" class="s" text-anchor="middle">lookup_quarantine</text>
  <text x="105" y="373" class="s" text-anchor="middle">lookup_cites</text>
  <text x="105" y="386" class="s" text-anchor="middle">lookup_dutyfree_shop</text>

  <!-- 문서 -->
  <rect x="30" y="540" width="390" height="130" class="box" fill="#f7f7f7" stroke="#bdbdbd" stroke-dasharray="4 3"/>
  <text x="50" y="563" class="s" font-weight="600">근거 문서 — 전부 기관에서 받아온 것 (fetch_docs.py)</text>
  <text x="50" y="586" class="s">면세  duty.md · casebook.md(보조)          관세청</text>
  <text x="50" y="605" class="s">검역  quarantine.md                                인천공항공사</text>
  <text x="50" y="624" class="s">멸종위기종  cites.md · cites_items.md</text>
  <text x="50" y="643" class="s">                    · cites_species.md          인천·관세청</text>
  <text x="50" y="662" class="s">면세점  dutyfree_shop.md                        관세청</text>

  <!-- 측정 -->
  <rect x="450" y="540" width="500" height="130" class="box" fill="#f7f7f7" stroke="#bdbdbd" stroke-dasharray="4 3"/>
  <text x="470" y="563" class="s" font-weight="600">측정 — evaluate.py (평가셋 12건) · probe_ambiguous.py (경계 8 + 애매 8)</text>
  <text x="470" y="586" class="s">도구 호출 적절성 = ②가 부른 도구 집합이 기대와 같은가 (넘김·되묻기는 빈 집합)</text>
  <text x="470" y="605" class="s">답변 적절성 = 담아야 할 사실 전부 + 금지 표현 0</text>
  <text x="470" y="624" class="s">기준선 83.3 / 58.3%  →  12회 개선  →  100 / 100%</text>
  <text x="470" y="643" class="s">한 번에 한 군데만 · 최소 2회 · 2회 연속 통과해야 수정됨</text>
  <text x="470" y="662" class="s">100% 는 천장이 아니라 평가셋의 크기다 — 경계·애매 질문이 세 번 구멍을 찾았다</text>

  <!-- edges -->
  <path d="M150,124 L197,124" class="edge"/>
  <path d="M285,154 L285,193" class="edge"/>
  <text x="293" y="177" class="lbl">카테고리</text>
  <path d="M370,131 L440,131 L440,131 L477,131" class="edge"/>
  <text x="420" y="122" class="lbl" text-anchor="middle">범위밖</text>
  <path d="M370,229 L477,229" class="edge"/>
  <text x="423" y="220" class="lbl" text-anchor="middle">규정을 못 고른다</text>
  <path d="M285,262 L285,301" class="edge"/>
  <text x="293" y="285" class="lbl">고를 수 있다</text>
  <path d="M370,345 L477,345" class="edge"/>
  <text x="423" y="336" class="lbl" text-anchor="middle">근거 3절</text>
  <path d="M567,386 L567,429" class="edge"/>
  <path d="M180,345 L197,345" class="edge"/>
  <!-- 근거 0 → handoff -->
  <path d="M370,320 L430,320 L430,168 L520,168 L520,164" class="edge"/>
  <text x="430" y="312" class="lbl">근거 0</text>
  <!-- 재작성 -->
  <path d="M655,450 L700,450 L700,345 L658,345" class="edge2"/>
  <text x="706" y="400" class="lblr">위반 → 1회</text>
  <!-- 결과로 -->
  <path d="M655,131 L712,131 L712,230 L767,230" class="edge"/>
  <path d="M655,229 L767,246" class="edge"/>
  <path d="M655,463 L730,463 L730,300 L767,300" class="edge"/>
</svg>
