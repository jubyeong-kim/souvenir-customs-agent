# 사람들이 "예전엔 이랬는데" 로 알고 있는 것을 바로잡으려면, 현재 규정만으로는 모자란다.
# 규정 페이지는 "지금 이렇다"만 말하고 "예전엔 달랐다"는 적지 않기 때문이다.
# 실제 문의를 관세청이 정리해 둔 상담 사례집이 그 간극을 메운다.
# ponytail: 1,000쪽 중 주제에 맞는 쪽만 뽑는다. 전체 색인은 고도화 단계에서.
- 파일: casebook.md
  제목: 관세행정 민원상담 사례집 (여행자 휴대품 부분)
  카테고리: 면세
  보조: true            # 규정 문서를 먼저 채우고 남는 자리에만 쓴다 (실험기록 #3)
  소관기관: 관세청 고객지원센터
  갱신주기: 1년 (사례집 발간)
  종류: pdf
  최대쪽: 10
  쪽키워드: ["술, 담배의 면세기준", "여행자 휴대품", "휴대품 면세", "자진신고"]
  # 「해외에서 발송되는」 = 해외직구 기준(150달러·1병). 이 봇은 직접 들고 오는 경우만
  # 다루는데 같은 "술 면세" 제목 아래 있어 모델이 인용해 버린다. 실험기록 #7.
  쪽제외: ["해외에서 발송되는", "발송되는 술"]
  url: https://www.customs.go.kr/common/nttFileDownload.do?fileKey=3b03db355afff4cb9eac21dcda749520

